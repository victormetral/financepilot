services:
  database:
    image: postgres:16
    container_name: financepilot-db
    environment:
      POSTGRES_USER: financepilot
      POSTGRES_PASSWORD: financepilot
      POSTGRES_DB: financepilot
    ports:
      - "5434:5432"
    volumes:
      - financepilot_data:/var/lib/postgresql/data

volumes:
  financepilot_data:
