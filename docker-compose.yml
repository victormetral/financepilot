# ==========================================================
#  docker-compose.yml : les services du projet
#  Lance la base PostgreSQL de FinancePilot dans Docker
# ==========================================================

services:
  # Base de données PostgreSQL
  db:
    image: postgres:18-alpine
    container_name: financepilot_postgres
    # Identifiants lus dans le fichier .env (jamais sur GitHub)
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Port du Mac : port du conteneur (5432 est pris par Lovelace)
    ports:
      - "5433:5432"
    # Les données survivent à la suppression du conteneur
    # (depuis la version 18 : on monte /var/lib/postgresql, plus /data)
    volumes:
      - postgres_data:/var/lib/postgresql

# Déclaration du volume utilisé plus haut
volumes:
  postgres_data: