# ==========================================================
#  nginx.conf : comment nginx sert le front Angular
#  Envoie les fichiers compilés, renvoie index.html pour les
#  routes du front, et règle le cache du navigateur
# ==========================================================

server {
    # Port d'écoute dans le conteneur (image sans root → 8080)
    listen 8080;

    # Dossier des fichiers compilés par ng build
    root /usr/share/nginx/html;
    index index.html;

    # Choix pro : compresser le texte avant l'envoi (éco-conception)
    gzip on;
    gzip_types text/css text/javascript application/javascript image/svg+xml;

    # Une route du front (/accounts…) n'est pas un fichier :
    # on renvoie index.html, puis Angular affiche le bon écran
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html change à chaque version : toujours le redemander
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Fichiers avec une empreinte dans le nom (main-MJ2KAR4C.js) :
    # nouveau contenu = nouveau nom → cache d'un an
    location ~* \.(?:js|css|woff2)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
